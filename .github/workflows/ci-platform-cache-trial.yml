name: Platform cache trial

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/ci-platform-cache-trial.yml'
      - 'config/scripts/ci-pnpm-verification-benchmark.mjs'
      - 'config/scripts/ci-pnpm-verification-controls.mjs'
      - 'config/scripts/orcad-windows-prebuild-cache.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-cache-trial-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ORCA_BACKGROUND_LAUNCH: '1'

defaults:
  run:
    shell: bash

jobs:
  pnpm_record:
    name: pnpm record ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-11-arm, macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
        with:
          cache-pnpm-verification: 'false'
      - name: Preserve the authentic seed and frozen install inputs
        run: node config/scripts/ci-pnpm-verification-benchmark.mjs --phase seed
      # These tiny trial caches belong to this run and PR ref, never production keys.
      - uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/pnpm-verification-trial/cache/lockfile-verified.jsonl
          key: pnpm-record-trial-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Begin pair 1 baseline
        run: node config/scripts/ci-pnpm-verification-benchmark.mjs --phase begin --sample 1 --treatment baseline
      - name: Measure pair 1 baseline
        run: node config/scripts/ci-pnpm-verification-benchmark.mjs --phase measure
      - name: Begin pair 1 restored
        run: node config/scripts/ci-pnpm-verification-benchmark.mjs --phase begin --sample 1 --treatment restored
      - uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/pnpm-verification-trial/cache/lockfile-verified.jsonl
          key: pnpm-record-trial-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true
      - name: Measure pair 1 restored
        run: node config/scripts/ci-pnpm-verification-benchmark.mjs --phase measure
      - name: Begin pair 2 restored
        run: node config/scripts/ci-pnpm-verification-benchmark.mjs --phase begin --sample 2 --treatment restored
      - uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/pnpm-verification-trial/cache/lockfile-verified.jsonl
          key: pnpm-record-trial-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true
      - name: Measure pair 2 restored
        run: node config/scripts/ci-pnpm-verification-benchmark.mjs --phase measure
      - name: Begin pair 2 baseline
        run: node config/scripts/ci-pnpm-verification-benchmark.mjs --phase begin --sample 2 --treatment baseline
      - name: Measure pair 2 baseline
        run: node config/scripts/ci-pnpm-verification-benchmark.mjs --phase measure
      - name: Begin pair 3 baseline
        run: node config/scripts/ci-pnpm-verification-benchmark.mjs --phase begin --sample 3 --treatment baseline
      - name: Measure pair 3 baseline
        run: node config/scripts/ci-pnpm-verification-benchmark.mjs --phase measure
      - name: Begin pair 3 restored
        run: node config/scripts/ci-pnpm-verification-benchmark.mjs --phase begin --sample 3 --treatment restored
      - uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/pnpm-verification-trial/cache/lockfile-verified.jsonl
          key: pnpm-record-trial-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true
      - name: Measure pair 3 restored
        run: node config/scripts/ci-pnpm-verification-benchmark.mjs --phase measure
      - name: Begin pair 4 restored
        run: node config/scripts/ci-pnpm-verification-benchmark.mjs --phase begin --sample 4 --treatment restored
      - uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/pnpm-verification-trial/cache/lockfile-verified.jsonl
          key: pnpm-record-trial-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true
      - name: Measure pair 4 restored
        run: node config/scripts/ci-pnpm-verification-benchmark.mjs --phase measure
      - name: Begin pair 4 baseline
        run: node config/scripts/ci-pnpm-verification-benchmark.mjs --phase begin --sample 4 --treatment baseline
      - name: Measure pair 4 baseline
        run: node config/scripts/ci-pnpm-verification-benchmark.mjs --phase measure
      - name: Verify policy rejection controls and summarize paired timings
        run: node config/scripts/ci-pnpm-verification-benchmark.mjs --phase finish
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pnpm-record-trial-${{ matrix.os }}
          path: ${{ runner.temp }}/pnpm-verification-trial
          retention-days: 7
          if-no-files-found: error

  windows_prebuild:
    name: Windows prebuild ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: node
      - name: Compile and fully test the fresh seed
        run: |
          pnpm build:orcad-prebuilds
          node config/scripts/orcad-windows-prebuild-cache.mjs --validate
          pnpm build:orcad-prebuilds --smoke
          pnpm build:orcad
          pnpm test:node-server --artifact
          node config/scripts/ci-windows-prebuild-benchmark.mjs --phase seed
      - name: Resolve the exact compiled-slot identity
        id: identity
        run: node config/scripts/orcad-windows-prebuild-cache.mjs --fingerprint
      - uses: actions/cache/save@v5
        with:
          path: ${{ steps.identity.outputs.path }}
          key: ${{ steps.identity.outputs.key }}-trial-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Begin prebuild pair 1 fresh
        run: node config/scripts/ci-windows-prebuild-benchmark.mjs --phase begin --sample 1 --treatment fresh
      - name: Measure prebuild pair 1 fresh
        run: node config/scripts/ci-windows-prebuild-benchmark.mjs --phase measure
      - name: Begin prebuild pair 1 restored
        run: node config/scripts/ci-windows-prebuild-benchmark.mjs --phase begin --sample 1 --treatment restored
      - uses: actions/cache/restore@v5
        with:
          path: ${{ steps.identity.outputs.path }}
          key: ${{ steps.identity.outputs.key }}-trial-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true
      - name: Measure prebuild pair 1 restored
        run: node config/scripts/ci-windows-prebuild-benchmark.mjs --phase measure
      - name: Begin prebuild pair 2 restored
        run: node config/scripts/ci-windows-prebuild-benchmark.mjs --phase begin --sample 2 --treatment restored
      - uses: actions/cache/restore@v5
        with:
          path: ${{ steps.identity.outputs.path }}
          key: ${{ steps.identity.outputs.key }}-trial-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true
      - name: Measure prebuild pair 2 restored
        run: node config/scripts/ci-windows-prebuild-benchmark.mjs --phase measure
      - name: Begin prebuild pair 2 fresh
        run: node config/scripts/ci-windows-prebuild-benchmark.mjs --phase begin --sample 2 --treatment fresh
      - name: Measure prebuild pair 2 fresh
        run: node config/scripts/ci-windows-prebuild-benchmark.mjs --phase measure
      - name: Begin prebuild pair 3 fresh
        run: node config/scripts/ci-windows-prebuild-benchmark.mjs --phase begin --sample 3 --treatment fresh
      - name: Measure prebuild pair 3 fresh
        run: node config/scripts/ci-windows-prebuild-benchmark.mjs --phase measure
      - name: Begin prebuild pair 3 restored
        run: node config/scripts/ci-windows-prebuild-benchmark.mjs --phase begin --sample 3 --treatment restored
      - uses: actions/cache/restore@v5
        with:
          path: ${{ steps.identity.outputs.path }}
          key: ${{ steps.identity.outputs.key }}-trial-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true
      - name: Measure prebuild pair 3 restored
        run: node config/scripts/ci-windows-prebuild-benchmark.mjs --phase measure
      - name: Begin prebuild pair 4 restored
        run: node config/scripts/ci-windows-prebuild-benchmark.mjs --phase begin --sample 4 --treatment restored
      - uses: actions/cache/restore@v5
        with:
          path: ${{ steps.identity.outputs.path }}
          key: ${{ steps.identity.outputs.key }}-trial-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true
      - name: Measure prebuild pair 4 restored
        run: node config/scripts/ci-windows-prebuild-benchmark.mjs --phase measure
      - name: Begin prebuild pair 4 fresh
        run: node config/scripts/ci-windows-prebuild-benchmark.mjs --phase begin --sample 4 --treatment fresh
      - name: Measure prebuild pair 4 fresh
        run: node config/scripts/ci-windows-prebuild-benchmark.mjs --phase measure
      - name: Qualify a final restored slot
        run: node config/scripts/ci-windows-prebuild-benchmark.mjs --phase begin --sample 1 --treatment restored
      - uses: actions/cache/restore@v5
        with:
          path: ${{ steps.identity.outputs.path }}
          key: ${{ steps.identity.outputs.key }}-trial-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true
      - name: Run persistence and lifecycle tests against the cache consumer
        run: |
          node config/scripts/orcad-windows-prebuild-cache.mjs --validate
          pnpm build:orcad-prebuilds --smoke
          pnpm build:orcad
          pnpm test:node-server --artifact
          node config/scripts/ci-windows-prebuild-benchmark.mjs --phase finish
      - uses: actions/setup-node@v6
        if: runner.arch == 'X64'
        with:
          node-version: '18'
      - name: Check the cached x64 slot still hands Node 18 off to the pinned Node
        if: runner.arch == 'X64'
        run: |
          node out/orcad/orcad.js --orcad-smoke-load-check
          node out/orcad/orcad.js --orcad-profile-state-preflight 00000000-0000-4000-8000-000000000018 > "$RUNNER_TEMP/preflight.json"
          node -e "const r=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'));if(r.runtime!=='node'||!/^24\./.test(r.runtimeVersion))process.exit(1)" "$RUNNER_TEMP/preflight.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-prebuild-trial-${{ matrix.os }}
          path: ${{ runner.temp }}/windows-prebuild-trial
          retention-days: 7
          if-no-files-found: error
